name: Bug report
description: Report a reproducible problem with BangerPrep
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        GitHub issues are public. Do not include email addresses, access tokens, authentication cookies, private invitation links, or other personal information.
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
      description: What happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Provide the smallest sequence that reproduces the problem.
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and device
      placeholder: Safari 26 on iPhone

